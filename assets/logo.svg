<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="shu logo">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ef"/>
      <stop offset="1" stop-color="#a8b8c8"/>
    </linearGradient>
  </defs>
  <!-- night-slate badge -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#0f172a"/>
  <!-- ensō: one brush stroke, left open — the form is never finished -->
  <g fill="none" stroke="url(#ink)" stroke-linecap="round">
    <!-- body of the stroke -->
    <path d="M 197.5 140.6 A 72 72 0 1 1 190.4 86" stroke-width="16"/>
    <!-- drying-brush tail tapering into the opening -->
    <path d="M 190.4 86 A 72 72 0 0 1 198.9 109.5" stroke-width="6"/>
  </g>
  <!-- press-down of the brush where the stroke begins -->
  <circle cx="197.5" cy="140.6" r="10" fill="url(#ink)"/>
  <!-- wordmark -->
  <text x="128" y="140" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace"
        font-weight="700" font-size="56" letter-spacing="2" fill="#f8f5ef">shu</text>
  <!-- 守破離 -->
  <text x="128" y="176" text-anchor="middle"
        font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif CJK JP', serif"
        font-size="21" letter-spacing="6" fill="#8494a8">守破離</text>
</svg>
