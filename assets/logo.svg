<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="shu logo">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <!-- badge -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#0f172a"/>
  <!-- sync ring: open loop with an arrowhead, the update/harvest cycle -->
  <circle cx="128" cy="128" r="76" fill="none" stroke="url(#ring)"
          stroke-width="11" stroke-linecap="round"
          stroke-dasharray="400 78" transform="rotate(28 128 128)"/>
  <polygon points="196,101 168,102 181,77" fill="#14b8a6"/>
  <!-- wordmark -->
  <text x="128" y="148" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace"
        font-weight="700" font-size="58" letter-spacing="2" fill="#f8fafc">shu</text>
</svg>
